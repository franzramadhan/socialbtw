[package]
name = "socialbtw"
version = "0.7.0"
edition = "2021"
license = "MIT"
description = "Hide unwanted replies on your own Threads posts"

[dependencies]
libc = "0.2"
postgres = "0.19"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde_json = "1"
tokio-postgres-rustls = "0.13"
ureq = { version = "2", features = ["json"] }
webpki-roots = "1"
regex-lite = "0.1.9"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
